{% set name = "cz-changeup" %}
{% set version = "1.1.4" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/cz_changeup-{{ version }}.tar.gz
  sha256: 0dd44b9108143c6d6c267e9b5ac2993224214a3eae7766a16889402ebe0b20f9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - commitizen >=3.0.0,<5.0.0

test:
  imports:
    - cz_changeup
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/kmnhan/cz-changeup
  summary: Commitizen plugin for better changelog generation
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/kmnhan/cz-changeup

extra:
  recipe-maintainers:
    - kmnhan
